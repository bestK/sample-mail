<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sample Mail</title>
        <link rel="icon" type="image/png" href="./favicon.png" />
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

            :root {
                --bg: #fafafa;
                --bg-grid: rgba(0, 0, 0, 0.035);
                --ink: #111111;
                --ink-muted: #666666;
                --line: #e5e5e5;
                --line-strong: #d4d4d4;
                --panel: #ffffff;
                --button: #111111;
                --button-hover: #000000;
                --danger: #b42318;
                --success: #087443;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                color: var(--ink);
                font-family: 'Plus Jakarta Sans', sans-serif;
                background:
                    linear-gradient(var(--bg-grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px), var(--bg);
                background-size:
                    20px 20px,
                    20px 20px,
                    auto;
                min-height: 100vh;
            }

            .shell {
                max-width: 1020px;
                margin: 0 auto;
                padding: 34px 18px 48px;
            }

            h1 {
                margin: 0;
                font-size: clamp(1.5rem, 1.6vw + 1rem, 2.25rem);
                letter-spacing: -0.02em;
                font-weight: 700;
            }

            .sub {
                margin: 10px 0 0;
                color: var(--ink-muted);
                font-size: 0.95rem;
            }

            .topbar {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-end;
                justify-content: space-between;
                gap: 14px;
            }

            .header {
                display: flex;
                align-items: center;
            }
            .github-link {
                display: flex;
                align-items: center;
                color: var(--ink);
                margin-left: 10px;
                transition:
                    opacity 120ms ease,
                    transform 120ms ease;
            }

            .github-link:hover {
                opacity: 0.7;
                transform: scale(1.1);
            }

            .view-tabs {
                display: inline-flex;
                gap: 6px;
                padding: 4px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: #fff;
            }

            .tab-btn {
                border: 0;
                border-radius: 7px;
                padding: 8px 11px;
                background: transparent;
                color: #555;
                font-size: 0.86rem;
            }

            .tab-btn:hover {
                transform: none;
                background: #f5f5f5;
            }

            .tab-btn.active {
                background: #111;
                color: #fff;
            }

            .panel {
                margin-top: 20px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 18px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
            }

            .view[hidden] {
                display: none;
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 12px;
            }

            @media (min-width: 860px) {
                .grid {
                    grid-template-columns: 1fr 1fr;
                }
            }

            details.advanced {
                margin-top: 12px;
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 8px 10px;
                background: #fcfcfc;
            }

            details.advanced summary {
                cursor: pointer;
                color: #4f4f4f;
                font-size: 0.9rem;
                user-select: none;
            }

            details.advanced .inner {
                margin-top: 10px;
            }

            details.advanced .inner label:not(:first-child) {
                margin-top: 10px;
            }

            label {
                display: block;
                font-size: 0.86rem;
                color: #505050;
                margin-bottom: 6px;
            }

            input {
                width: 100%;
                padding: 10px 11px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: #ffffff;
                color: var(--ink);
                outline: none;
                font-size: 0.95rem;
                transition:
                    border-color 120ms ease,
                    box-shadow 120ms ease;
            }

            input:focus {
                border-color: var(--line-strong);
                box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08);
            }

            .field-row {
                display: grid;
                grid-template-columns: 1fr;
                gap: 12px;
            }

            @media (min-width: 720px) {
                .field-row {
                    grid-template-columns: 1fr auto;
                    align-items: end;
                }
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 12px;
            }

            button {
                border: 1px solid #000;
                border-radius: 10px;
                padding: 10px 14px;
                font-weight: 600;
                font-family: 'Plus Jakarta Sans', sans-serif;
                cursor: pointer;
                background: var(--button);
                color: #fff;
                transition:
                    transform 120ms ease,
                    background 120ms ease,
                    border-color 120ms ease;
            }

            button:hover {
                transform: translateY(-1px);
                background: var(--button-hover);
            }

            button:disabled {
                cursor: not-allowed;
                opacity: 0.58;
                transform: none;
            }

            button.secondary {
                background: #fff;
                color: #111;
                border-color: var(--line-strong);
            }

            button.danger-btn {
                background: #fff;
                color: var(--danger);
                border-color: #efc7c3;
            }

            button.danger-btn:hover {
                background: #fff8f7;
            }

            .status {
                margin-top: 12px;
                padding: 10px 11px;
                border-radius: 10px;
                border: 1px solid var(--line);
                background: #fcfcfc;
                color: var(--ink-muted);
                font-size: 0.92rem;
                min-height: 42px;
                display: flex;
                align-items: center;
            }

            .status.err {
                color: var(--danger);
                border-color: #efc7c3;
                background: #fff8f7;
            }

            .status.ok {
                color: var(--success);
                border-color: #badfcc;
                background: #f6fdf9;
            }

            .admin-tools {
                display: grid;
                gap: 16px;
            }

            .admin-tools[hidden] {
                display: none;
            }

            .token-result {
                display: none;
                margin-top: 12px;
                border: 1px solid #badfcc;
                border-radius: 10px;
                background: #f6fdf9;
                padding: 10px;
            }

            .token-result.show {
                display: block;
            }

            .token-value {
                margin: 8px 0 0;
                padding: 9px;
                border: 1px solid #cfe8d9;
                border-radius: 8px;
                background: #fff;
                font-family: 'IBM Plex Mono', monospace;
                font-size: 0.82rem;
                line-height: 1.45;
                word-break: break-all;
            }

            .token-list {
                display: grid;
                gap: 10px;
            }

            .token-item {
                display: grid;
                gap: 10px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: #fff;
                padding: 12px;
            }

            @media (min-width: 760px) {
                .token-item {
                    grid-template-columns: minmax(0, 1fr) auto;
                    align-items: center;
                }
            }

            .token-name {
                margin: 0;
                font-weight: 700;
                overflow-wrap: anywhere;
            }

            .token-meta {
                margin: 5px 0 0;
                color: var(--ink-muted);
                font-size: 0.82rem;
                line-height: 1.5;
                overflow-wrap: anywhere;
            }

            .token-prefix {
                font-family: 'IBM Plex Mono', monospace;
                color: #333;
            }

            .pill {
                display: inline-flex;
                align-items: center;
                width: max-content;
                max-width: 100%;
                margin-top: 7px;
                padding: 3px 7px;
                border-radius: 999px;
                background: #f5f5f5;
                border: 1px solid var(--line);
                color: #555;
                font-size: 0.74rem;
            }

            .pill.revoked {
                color: var(--danger);
                border-color: #efc7c3;
                background: #fff8f7;
            }

            .emails {
                margin-top: 16px;
                display: grid;
                gap: 10px;
                min-width: 0;
            }

            .sponsor {
                margin-top: 14px;
                margin-bottom: 10px;
                border-top: 1px dashed var(--line);
                padding-top: 10px;
            }

            .sponsor-mark {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 8px;
                color: #6b6b6b;
                font-size: 0.74rem;
                letter-spacing: 0.04em;
                text-transform: uppercase;
            }

            .sponsor-mark svg {
                width: 14px;
                height: 14px;
                display: block;
                stroke: #7a7a7a;
            }

            .sponsor-list {
                display: grid;
                gap: 8px;
                min-width: 0;
            }

            .sponsor-item {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                overflow: hidden;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: #fff;
                padding: 9px;
                animation: fadeIn 260ms ease;
            }

            .sponsor-item .row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                min-width: 0;
            }

            .sponsor-item .name {
                min-width: 0;
                font-size: 0.74rem;
                color: #7a7a7a;
                margin: 0;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                font-weight: 500;
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .sponsor-item .hash {
                margin: 7px 0 0;
                font-family: 'IBM Plex Mono', monospace;
                font-size: 0.8rem;
                line-height: 1.45;
                word-break: break-all;
                background: #fcfcfc;
                border: 1px solid #ededed;
                border-radius: 8px;
                padding: 7px;
                color: #404040;
            }

            .copy-btn {
                flex-shrink: 0;
                max-width: 100%;
                border: 1px solid #e1e1e1;
                border-radius: 8px;
                background: #fff;
                color: #5f5f5f;
                padding: 6px 9px;
                font-size: 0.72rem;
                font-weight: 500;
                cursor: pointer;
                transition:
                    transform 120ms ease,
                    background 120ms ease;
                white-space: nowrap;
            }

            .copy-btn:hover {
                transform: translateY(-1px);
                background: #f8f8f8;
            }

            .sponsor-empty {
                margin: 0;
                color: #777;
                font-size: 0.8rem;
                border: 1px dashed #e8e8e8;
                border-radius: 10px;
                background: #fcfcfc;
                padding: 8px;
            }

            .mail {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                overflow: hidden;
                border: 1px solid var(--line);
                background: #fff;
                border-radius: 12px;
                padding: 12px;
                animation: fadeIn 260ms ease;
                display: grid;
                gap: 10px;
            }

            .mail-head {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-start;
                justify-content: space-between;
                gap: 8px 12px;
                min-width: 0;
            }

            .mail-title-wrap {
                flex: 1 1 280px;
                min-width: 0;
            }

            .mail h3 {
                margin: 0;
                font-size: 1rem;
                line-height: 1.4;
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .mail-time {
                flex: 0 1 auto;
                max-width: 100%;
                min-width: 0;
                padding: 4px 8px;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: #fcfcfc;
                color: var(--ink-muted);
                font-size: 0.78rem;
                line-height: 1.4;
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .mail-meta {
                display: grid;
                gap: 6px;
                min-width: 0;
            }

            .mail-meta-row {
                display: grid;
                grid-template-columns: 110px minmax(0, 1fr);
                gap: 8px;
                min-width: 0;
                align-items: start;
            }

            .mail-meta-label {
                color: #7a7a7a;
                font-size: 0.78rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                line-height: 1.5;
            }

            .mail-meta-value {
                min-width: 0;
                color: var(--ink-muted);
                font-size: 0.85rem;
                line-height: 1.5;
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .txt-wrapper {
                position: relative;
            }

            .txt,
            .html-view {
                margin: 0;
                padding: 10px;
                white-space: pre-wrap;
                line-height: 1.45;
                font-size: 0.92rem;
                font-family: 'IBM Plex Mono', monospace;
                color: #1f1f1f;
                min-height: 100px;
                max-height: 30em;
                overflow: auto;
                overflow-wrap: anywhere;
                word-break: break-word;
                background: #fcfcfc;
                border: 1px solid #ededed;
                border-radius: 10px;
            }

            .copy-raw-btn {
                position: absolute;
                top: 8px;
                right: 8px;
                width: 28px;
                height: 28px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(2px);
                border: 1px solid #ddd;
                border-radius: 6px;
                cursor: pointer;
                opacity: 0;
                transition: all 180ms ease;
                z-index: 10;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            }

            .txt-wrapper:hover .copy-raw-btn {
                opacity: 1;
            }

            .copy-raw-btn:hover {
                background: #fff;
                border-color: #bbb;
                transform: translateY(-1px);
            }

            .copy-raw-btn svg {
                width: 14px;
                height: 14px;
                stroke: #555;
                fill: none;
            }

            .html-view {
                padding: 0;
                background: #fff;
                display: block;
                border: 1px solid #ededed;
            }

            .html-view iframe {
                width: 100%;
                height: 30em;
                border: none;
                display: block;
                border-radius: 10px;
            }

            .mail-content-toolbar {
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                margin-bottom: 4px;
            }

            .toggle-btn {
                appearance: none;
                background: #f1f1f1;
                border: 1px solid #e1e1e1;
                border-radius: 6px;
                padding: 4px 10px;
                font-size: 0.72rem;
                font-weight: 600;
                color: #666;
                cursor: pointer;
                transition: all 120ms ease;
            }

            .toggle-btn.active {
                background: var(--button);
                color: #fff;
                border-color: #000;
            }

            .toggle-btn:hover:not(.active) {
                background: #e5e5e5;
            }

            @media (max-width: 540px) {
                .mail-meta-row {
                    grid-template-columns: 1fr;
                    gap: 2px;
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <main class="shell">
            <div class="topbar">
                <div>
                    <div class="header">
                        <h1>Sample Mail</h1>
                        <a
                            href="https://github.com/bestK/sample-mail"
                            target="_blank"
                            class="github-link"
                            aria-label="GitHub Repository"
                        >
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
                                />
                            </svg>
                        </a>
                    </div>
                    <p class="sub">Secure and effortless temporary email solution.</p>
                </div>
                <nav class="view-tabs" aria-label="Views">
                    <button id="inboxTab" class="tab-btn active" type="button">Inbox</button>
                    <button id="adminTab" class="tab-btn" type="button">Admin</button>
                </nav>
            </div>

            <section id="inboxView" class="panel view">
                <div>
                    <div>
                        <label for="address">Email Address</label>
                        <input id="address" placeholder="example@your-domain.com" />
                    </div>
                </div>

                <details class="advanced">
                    <summary>Advanced: API Base URL</summary>
                    <div class="inner">
                        <label for="accessToken">Access Token</label>
                        <input id="accessToken" type="password" autocomplete="off" placeholder="at_..." />

                        <label for="apiBase">API Base URL</label>
                        <input id="apiBase" placeholder="https://your-api.example.com" />
                    </div>
                </details>

                <div class="actions">
                    <button id="createBtn">Generate Inbox</button>
                    <button id="fetchBtn" class="secondary">Check New Mail</button>
                </div>

                <div id="status" class="status">Inbox is ready.</div>
                <div id="emails" class="emails"></div>

                <section class="sponsor">
                    <div class="sponsor-mark" aria-label="sponsor">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 8h12v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"></path>
                            <path d="M16 10h2a2 2 0 1 1 0 4h-2"></path>
                            <path d="M7 5c0-1 1-2 2-2"></path>
                            <path d="M11 5c0-1 1-2 2-2"></path>
                        </svg>
                        Sponsor
                    </div>
                    <div id="sponsorList" class="sponsor-list"></div>
                </section>
            </section>

            <section id="adminView" class="panel view" hidden>
                <div id="adminGate">
                    <div class="field-row">
                        <div>
                            <label for="adminPassword">Admin Password</label>
                            <input
                                id="adminPassword"
                                type="password"
                                autocomplete="current-password"
                                placeholder="PASSWORD"
                            />
                        </div>
                        <button id="adminLoginBtn" type="button">Enter Admin</button>
                    </div>
                </div>

                <div id="adminStatus" class="status">Password is required for token management.</div>

                <div id="adminTools" class="admin-tools" hidden>
                    <div>
                        <div class="field-row">
                            <div>
                                <label for="tokenName">Token Name</label>
                                <input id="tokenName" placeholder="Production client" />
                            </div>
                            <button id="createTokenBtn" type="button">Create Token</button>
                        </div>

                        <div id="tokenResult" class="token-result">
                            <strong>New token</strong>
                            <p id="newTokenValue" class="token-value"></p>
                            <div class="actions">
                                <button id="copyTokenBtn" class="secondary" type="button">Copy Token</button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="actions">
                            <button id="refreshTokensBtn" class="secondary" type="button">Refresh Tokens</button>
                            <button id="adminLockBtn" class="secondary" type="button">Lock</button>
                        </div>
                        <div id="tokenList" class="token-list"></div>
                    </div>
                </div>
            </section>
        </main>

        <script>
            const els = {
                inboxTab: document.getElementById('inboxTab'),
                adminTab: document.getElementById('adminTab'),
                inboxView: document.getElementById('inboxView'),
                adminView: document.getElementById('adminView'),
                apiBase: document.getElementById('apiBase'),
                accessToken: document.getElementById('accessToken'),
                address: document.getElementById('address'),
                createBtn: document.getElementById('createBtn'),
                fetchBtn: document.getElementById('fetchBtn'),
                status: document.getElementById('status'),
                emails: document.getElementById('emails'),
                sponsorList: document.getElementById('sponsorList'),
                adminGate: document.getElementById('adminGate'),
                adminPassword: document.getElementById('adminPassword'),
                adminLoginBtn: document.getElementById('adminLoginBtn'),
                adminStatus: document.getElementById('adminStatus'),
                adminTools: document.getElementById('adminTools'),
                tokenName: document.getElementById('tokenName'),
                createTokenBtn: document.getElementById('createTokenBtn'),
                tokenResult: document.getElementById('tokenResult'),
                newTokenValue: document.getElementById('newTokenValue'),
                copyTokenBtn: document.getElementById('copyTokenBtn'),
                refreshTokensBtn: document.getElementById('refreshTokensBtn'),
                adminLockBtn: document.getElementById('adminLockBtn'),
                tokenList: document.getElementById('tokenList'),
            };

            const POLL_INTERVAL_MS = 3000;
            const AWAY_TIMEOUT_MS = 5 * 60 * 1000;
            const ACTIVITY_EVENTS = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'];
            let pollingTimer = null;
            let awayTimer = null;
            let pausedByAway = false;
            let lastActivityReset = 0;
            let autoFetching = false;
            let lastRenderedSignature = null;
            let adminPassword = '';
            let lastNewToken = '';

            const defaultBase = window.location.origin;
            const savedBase = localStorage.getItem('apiBase') || defaultBase;
            const savedAccessToken = localStorage.getItem('accessToken') || '';
            els.apiBase.value = savedBase;
            els.accessToken.value = savedAccessToken;

            const savedAddress = localStorage.getItem('lastEmailAddress') || '';
            els.address.value = savedAddress;

            function normalizeBase(raw) {
                return raw.trim().replace(/\/$/, '');
            }

            function setStatusElement(el, text, state) {
                el.textContent = text;
                el.classList.toggle('err', state === 'err');
                el.classList.toggle('ok', state === 'ok');
            }

            function setStatus(text, isError) {
                setStatusElement(els.status, text, isError ? 'err' : '');
            }

            function setAdminStatus(text, state) {
                setStatusElement(els.adminStatus, text, state || '');
            }

            function setBusy(busy) {
                els.createBtn.disabled = busy;
                els.fetchBtn.disabled = busy;
            }

            function setAdminBusy(busy) {
                els.adminLoginBtn.disabled = busy;
                els.createTokenBtn.disabled = busy;
                els.refreshTokensBtn.disabled = busy;
            }

            function getBase() {
                const base = normalizeBase(els.apiBase.value || defaultBase);
                localStorage.setItem('apiBase', base);
                return base;
            }

            function getAccessToken() {
                const token = els.accessToken.value.trim();
                localStorage.setItem('accessToken', token);
                return token;
            }

            function getClientTimeZone() {
                try {
                    return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
                } catch (_) {
                    return 'UTC';
                }
            }

            function withClientTimeZone(path) {
                const timeZone = getClientTimeZone();
                if (!timeZone) return path;
                const separator = path.includes('?') ? '&' : '?';
                return path + separator + 'timezone=' + encodeURIComponent(timeZone);
            }

            async function apiRequest(path, options) {
                const opts = options || {};
                const base = getBase();
                const headers = {};

                if (opts.body !== undefined) {
                    headers['content-type'] = 'application/json';
                }

                if (opts.auth) {
                    const token = getAccessToken();
                    if (!token) {
                        throw new Error('Access token is required. Create one in Admin and paste it here.');
                    }
                    headers.authorization = 'Bearer ' + token;
                }

                if (opts.admin) {
                    if (!adminPassword) {
                        throw new Error('Admin password is required.');
                    }
                    headers['x-admin-password'] = adminPassword;
                }

                const res = await fetch(base + path, {
                    method: opts.method || 'GET',
                    headers,
                    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
                });
                let body = null;
                try {
                    body = await res.json();
                } catch (_) {
                    body = null;
                }

                if (!res.ok || !body || body.success === false) {
                    const msg = body && body.error ? body.error : 'Request failed: ' + res.status;
                    throw new Error(msg);
                }

                return body;
            }

            async function apiGet(path, options) {
                return apiRequest(path, { ...(options || {}), method: 'GET' });
            }

            function showView(view) {
                const isAdmin = view === 'admin';
                els.inboxView.hidden = isAdmin;
                els.adminView.hidden = !isAdmin;
                els.inboxTab.classList.toggle('active', !isAdmin);
                els.adminTab.classList.toggle('active', isAdmin);
            }

            function clearEmails() {
                els.emails.innerHTML = '';
            }

            function renderSponsorChannels(channels) {
                els.sponsorList.innerHTML = '';

                if (!Array.isArray(channels) || channels.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'sponsor-empty';
                    empty.textContent = 'No sponsor channel configured.';
                    els.sponsorList.appendChild(empty);
                    return;
                }

                const frag = document.createDocumentFragment();
                for (const channel of channels) {
                    const card = document.createElement('article');
                    card.className = 'sponsor-item';

                    const name = document.createElement('p');
                    name.className = 'name';
                    name.textContent =
                        channel.name || (channel.currency ? channel.currency + ' Transfer' : 'Sponsor Channel');

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.type = 'button';
                    copyBtn.textContent = 'Copy Address';

                    copyBtn.addEventListener('click', async () => {
                        const value = channel.receive_hash || '';
                        if (!value) return;
                        try {
                            await navigator.clipboard.writeText(value);
                            copyBtn.textContent = 'Copied';
                            setTimeout(() => {
                                copyBtn.textContent = 'Copy Address';
                            }, 1200);
                        } catch (_) {
                            copyBtn.textContent = 'Copy Failed';
                            setTimeout(() => {
                                copyBtn.textContent = 'Copy Address';
                            }, 1200);
                        }
                    });

                    const hash = document.createElement('p');
                    hash.className = 'hash';
                    hash.textContent = channel.receive_hash || '-';

                    const row = document.createElement('div');
                    row.className = 'row';
                    row.appendChild(name);
                    row.appendChild(copyBtn);

                    card.appendChild(row);
                    card.appendChild(hash);
                    frag.appendChild(card);
                }

                els.sponsorList.appendChild(frag);
            }

            async function loadSponsorInfo() {
                try {
                    const body = await apiGet('/sponsor/info');
                    const channels = body && body.data ? body.data.channels : [];
                    renderSponsorChannels(channels || []);
                } catch (_) {
                    renderSponsorChannels([]);
                }
            }

            function buildSignature(items) {
                if (!Array.isArray(items)) return '[]';
                return items.map(item => [item.createdAt, item.subject, item.from, item.to].join('|')).join('||');
            }

            function createMailMetaRow(label, value) {
                const row = document.createElement('div');
                row.className = 'mail-meta-row';

                const labelEl = document.createElement('span');
                labelEl.className = 'mail-meta-label';
                labelEl.textContent = label;

                const valueEl = document.createElement('span');
                valueEl.className = 'mail-meta-value';
                valueEl.textContent = value || '-';

                row.appendChild(labelEl);
                row.appendChild(valueEl);
                return row;
            }

            function renderMailBody(item, mode) {
                if (mode === 'html' && item.html) {
                    const container = document.createElement('div');
                    container.className = 'html-view';
                    const iframe = document.createElement('iframe');
                    // Sandbox for safety: allow-same-origin is needed for srcdoc sometimes but use caution
                    iframe.sandbox = 'allow-popups allow-popups-to-escape-sandbox';
                    iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
            <head>
              <base target="_blank">
              <style>
                body {
                  margin: 12px;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                  line-height: 1.5;
                  color: #111;
                }
                img { max-width: 100%; height: auto; }
              </style>
            </head>
            <body>${item.html}</body>
          </html>
        `;
                    container.appendChild(iframe);
                    return container;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'txt-wrapper';

                const textVal = item.text || item.html || '(No content)';
                const text = document.createElement('p');
                text.className = 'txt';
                text.textContent = textVal;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-raw-btn';
                copyBtn.type = 'button';
                copyBtn.title = 'Copy raw text';
                copyBtn.innerHTML = `
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      `;

                copyBtn.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(textVal);
                        copyBtn.innerHTML = `
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: #059669;">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          `;
                        setTimeout(() => {
                            copyBtn.innerHTML = `
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            `;
                        }, 1500);
                    } catch (_) {
                        // ignore
                    }
                };

                wrapper.appendChild(text);
                wrapper.appendChild(copyBtn);
                return wrapper;
            }

            function renderEmails(items) {
                lastRenderedSignature = buildSignature(items);
                clearEmails();
                if (!Array.isArray(items) || items.length === 0) {
                    setStatus('No mail yet for this inbox.', false);
                    return;
                }

                const frag = document.createDocumentFragment();
                for (const item of items) {
                    const card = document.createElement('article');
                    card.className = 'mail';

                    const head = document.createElement('div');
                    head.className = 'mail-head';

                    const titleWrap = document.createElement('div');
                    titleWrap.className = 'mail-title-wrap';

                    const title = document.createElement('h3');
                    title.textContent = item.subject || '(No subject)';

                    const time = document.createElement('div');
                    time.className = 'mail-time';
                    time.textContent = item.createdAt || '-';

                    titleWrap.appendChild(title);
                    head.appendChild(titleWrap);
                    head.appendChild(time);

                    const meta = document.createElement('div');
                    meta.className = 'mail-meta';
                    meta.appendChild(createMailMetaRow('From', item.from || '-'));
                    meta.appendChild(createMailMetaRow('To', item.to || '-'));
                    if (item.forwarded_to) {
                        meta.appendChild(createMailMetaRow('Forwarded To', item.forwarded_to));
                    }

                    // Content Area
                    const contentWrap = document.createElement('div');
                    contentWrap.className = 'mail-content';

                    const toolbar = document.createElement('div');
                    toolbar.className = 'mail-content-toolbar';

                    const btnHtml = document.createElement('button');
                    btnHtml.className = 'toggle-btn';
                    btnHtml.textContent = 'HTML';
                    const btnRaw = document.createElement('button');
                    btnRaw.className = 'toggle-btn';
                    btnRaw.textContent = 'Raw';

                    let currentMode = item.html ? 'html' : 'raw';
                    if (currentMode === 'html') btnHtml.classList.add('active');
                    else btnRaw.classList.add('active');

                    const bodyContainer = document.createElement('div');
                    bodyContainer.appendChild(renderMailBody(item, currentMode));

                    const updateView = mode => {
                        if (currentMode === mode) return;
                        currentMode = mode;
                        btnHtml.classList.toggle('active', mode === 'html');
                        btnRaw.classList.toggle('active', mode === 'raw');
                        bodyContainer.innerHTML = '';
                        bodyContainer.appendChild(renderMailBody(item, mode));
                    };

                    btnHtml.onclick = () => updateView('html');
                    btnRaw.onclick = () => updateView('raw');

                    if (item.html) toolbar.appendChild(btnHtml);
                    toolbar.appendChild(btnRaw);

                    contentWrap.appendChild(toolbar);
                    contentWrap.appendChild(bodyContainer);

                    card.appendChild(head);
                    card.appendChild(meta);
                    card.appendChild(contentWrap);
                    frag.appendChild(card);
                }

                els.emails.appendChild(frag);
                setStatus('Showing ' + items.length + ' messages.', false);
            }

            async function onCreateAddress() {
                try {
                    setBusy(true);
                    setStatus('Creating a new inbox...', false);
                    const body = await apiGet('/email/create', { auth: true });
                    const addr = body && body.data ? body.data.address : '';
                    if (!addr) throw new Error('No address returned by API.');
                    els.address.value = addr;
                    localStorage.setItem('lastEmailAddress', addr);
                    lastRenderedSignature = null;
                    clearEmails();
                    setStatus('New inbox is ready: ' + addr, false);
                } catch (err) {
                    setStatus(err.message || String(err), true);
                } finally {
                    setBusy(false);
                }
            }

            async function onFetchEmails() {
                try {
                    const addr = els.address.value.trim();
                    if (!addr) throw new Error('Please fill in email address first.');

                    setBusy(true);
                    setStatus('Checking for new mail...', false);
                    const body = await apiGet(withClientTimeZone('/email/' + encodeURIComponent(addr) + '?limit=10'), {
                        auth: true,
                    });
                    renderEmails(body.data || []);
                } catch (err) {
                    clearEmails();
                    setStatus(err.message || String(err), true);
                } finally {
                    setBusy(false);
                }
            }

            function startAutoPolling() {
                if (pollingTimer) return;

                pollingTimer = setInterval(async () => {
                    const addr = els.address.value.trim();
                    if (!addr || autoFetching) return;

                    try {
                        autoFetching = true;
                        const body = await apiGet(
                            withClientTimeZone('/email/' + encodeURIComponent(addr) + '?limit=10'),
                            { auth: true },
                        );
                        const items = body.data || [];
                        const nextSignature = buildSignature(items);
                        if (nextSignature !== lastRenderedSignature) {
                            renderEmails(items);
                        }
                    } catch (err) {
                        setStatus(err.message || String(err), true);
                    } finally {
                        autoFetching = false;
                    }
                }, POLL_INTERVAL_MS);
            }

            function stopAutoPolling() {
                if (!pollingTimer) return;
                clearInterval(pollingTimer);
                pollingTimer = null;
            }

            function clearAwayTimer() {
                if (!awayTimer) return;
                clearTimeout(awayTimer);
                awayTimer = null;
            }

            function resumeFromAway() {
                pausedByAway = false;
                window.alert('Auto-refresh was paused after 5 minutes of inactivity. Click OK to resume checking for new mail.');
                startAutoPolling();
            }

            // (Re)arm the idle countdown. Fires when the user has neither interacted
            // with nor viewed the page for AWAY_TIMEOUT_MS.
            function armAwayCountdown() {
                clearAwayTimer();
                awayTimer = setTimeout(() => {
                    awayTimer = null;
                    stopAutoPolling();
                    pausedByAway = true;
                }, AWAY_TIMEOUT_MS);
            }

            // Called on any real user activity (throttled to once per second).
            function onUserActivity() {
                const now = Date.now();
                if (now - lastActivityReset < 1000) return;
                lastActivityReset = now;

                if (pausedByAway) {
                    resumeFromAway();
                    return;
                }
                // Only keep a countdown running while the page is visible; a hidden
                // page can't receive activity, so its countdown is left to expire.
                if (!document.hidden) armAwayCountdown();
            }

            function handleVisibilityChange() {
                if (document.hidden) {
                    // Page left in the background: run the idle countdown to completion.
                    armAwayCountdown();
                    return;
                }

                // Page visible again: treat as activity.
                clearAwayTimer();
                if (pausedByAway) {
                    resumeFromAway();
                } else {
                    armAwayCountdown();
                }
            }

            function renderTokens(tokens) {
                els.tokenList.innerHTML = '';

                if (!Array.isArray(tokens) || tokens.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'sponsor-empty';
                    empty.textContent = 'No access tokens yet.';
                    els.tokenList.appendChild(empty);
                    return;
                }

                const frag = document.createDocumentFragment();
                for (const token of tokens) {
                    const item = document.createElement('article');
                    item.className = 'token-item';

                    const detail = document.createElement('div');

                    const name = document.createElement('p');
                    name.className = 'token-name';
                    name.textContent = token.name || 'Access token';

                    const meta = document.createElement('p');
                    meta.className = 'token-meta';
                    meta.appendChild(document.createTextNode('Prefix '));
                    const prefix = document.createElement('span');
                    prefix.className = 'token-prefix';
                    prefix.textContent = token.prefix || '-';
                    meta.appendChild(prefix);
                    meta.appendChild(document.createTextNode(' | Created ' + (token.createdAt || '-')));
                    meta.appendChild(document.createTextNode(' | Last used ' + (token.lastUsedAt || '-')));

                    const state = document.createElement('span');
                    state.className = 'pill' + (token.revokedAt ? ' revoked' : '');
                    state.textContent = token.revokedAt ? 'Revoked' : 'Active';

                    detail.appendChild(name);
                    detail.appendChild(meta);
                    detail.appendChild(state);
                    item.appendChild(detail);

                    if (!token.revokedAt) {
                        const revokeBtn = document.createElement('button');
                        revokeBtn.className = 'danger-btn';
                        revokeBtn.type = 'button';
                        revokeBtn.textContent = 'Revoke';
                        revokeBtn.addEventListener('click', () => revokeToken(token.id));
                        item.appendChild(revokeBtn);
                    }

                    frag.appendChild(item);
                }

                els.tokenList.appendChild(frag);
            }

            async function unlockAdmin() {
                try {
                    const password = els.adminPassword.value;
                    if (!password) throw new Error('Please enter admin password.');

                    setAdminBusy(true);
                    setAdminStatus('Checking password...', '');
                    await apiRequest('/admin/login', {
                        method: 'POST',
                        body: { password },
                    });

                    adminPassword = password;
                    els.adminGate.hidden = true;
                    els.adminTools.hidden = false;
                    setAdminStatus('Admin unlocked.', 'ok');
                    await loadTokens();
                } catch (err) {
                    adminPassword = '';
                    setAdminStatus(err.message || String(err), 'err');
                } finally {
                    setAdminBusy(false);
                }
            }

            function lockAdmin() {
                adminPassword = '';
                lastNewToken = '';
                els.adminPassword.value = '';
                els.adminGate.hidden = false;
                els.adminTools.hidden = true;
                els.tokenResult.classList.remove('show');
                els.tokenList.innerHTML = '';
                setAdminStatus('Password is required for token management.', '');
            }

            async function loadTokens() {
                try {
                    setAdminBusy(true);
                    const body = await apiGet('/admin/tokens', { admin: true });
                    renderTokens(body.data || []);
                    setAdminStatus('Token list loaded.', 'ok');
                } catch (err) {
                    setAdminStatus(err.message || String(err), 'err');
                } finally {
                    setAdminBusy(false);
                }
            }

            async function createToken() {
                try {
                    setAdminBusy(true);
                    setAdminStatus('Creating token...', '');
                    const body = await apiRequest('/admin/tokens', {
                        method: 'POST',
                        admin: true,
                        body: {
                            name: els.tokenName.value.trim(),
                        },
                    });

                    const data = body.data || {};
                    lastNewToken = data.token || '';
                    if (!lastNewToken) throw new Error('No token returned by API.');

                    els.newTokenValue.textContent = lastNewToken;
                    els.tokenResult.classList.add('show');
                    els.accessToken.value = lastNewToken;
                    localStorage.setItem('accessToken', lastNewToken);
                    await loadTokens();
                    setAdminStatus('Token created. The full value is shown once.', 'ok');
                } catch (err) {
                    setAdminStatus(err.message || String(err), 'err');
                } finally {
                    setAdminBusy(false);
                }
            }

            async function revokeToken(id) {
                try {
                    setAdminBusy(true);
                    setAdminStatus('Revoking token...', '');
                    await apiRequest('/admin/tokens/' + encodeURIComponent(id), {
                        method: 'DELETE',
                        admin: true,
                    });
                    await loadTokens();
                    setAdminStatus('Token revoked.', 'ok');
                } catch (err) {
                    setAdminStatus(err.message || String(err), 'err');
                } finally {
                    setAdminBusy(false);
                }
            }

            async function copyNewToken() {
                if (!lastNewToken) return;

                try {
                    await navigator.clipboard.writeText(lastNewToken);
                    els.copyTokenBtn.textContent = 'Copied';
                } catch (_) {
                    els.copyTokenBtn.textContent = 'Copy Failed';
                }

                setTimeout(() => {
                    els.copyTokenBtn.textContent = 'Copy Token';
                }, 1200);
            }

            els.inboxTab.addEventListener('click', () => showView('inbox'));
            els.adminTab.addEventListener('click', () => showView('admin'));
            els.createBtn.addEventListener('click', onCreateAddress);
            els.fetchBtn.addEventListener('click', onFetchEmails);
            els.accessToken.addEventListener('change', getAccessToken);
            els.apiBase.addEventListener('change', loadSponsorInfo);
            els.adminLoginBtn.addEventListener('click', unlockAdmin);
            els.adminPassword.addEventListener('keydown', event => {
                if (event.key === 'Enter') unlockAdmin();
            });
            els.createTokenBtn.addEventListener('click', createToken);
            els.refreshTokensBtn.addEventListener('click', loadTokens);
            els.adminLockBtn.addEventListener('click', lockAdmin);
            els.copyTokenBtn.addEventListener('click', copyNewToken);
            els.address.addEventListener('input', () => {
                localStorage.setItem('lastEmailAddress', els.address.value.trim());
            });

            if (window.location.pathname.replace(/\/$/, '').endsWith('/admin')) {
                showView('admin');
            }

            document.addEventListener('visibilitychange', handleVisibilityChange);
            for (const evt of ACTIVITY_EVENTS) {
                window.addEventListener(evt, onUserActivity, { passive: true });
            }

            startAutoPolling();
            armAwayCountdown();
            loadSponsorInfo();
        </script>
    </body>
</html>
